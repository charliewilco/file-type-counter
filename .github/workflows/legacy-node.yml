name: Legacy Node

on:
  push:
    paths:
      - "legacy/**"
      - ".github/workflows/legacy-node.yml"
  pull_request:
    paths:
      - "legacy/**"
      - ".github/workflows/legacy-node.yml"

jobs:
  test-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "legacy/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: npm run build
      - name: Check formatting
        run: npx prettier --check .
      - name: Run tests
        run: npm test
      - name: Run CLI smoke test
        run: npm run _bin -- ../fixture --ci
